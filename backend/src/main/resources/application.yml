# Vitaura Nutrition Backend - Application Configuration
# ============================================================
# DO NOT commit real values. Use environment variables.
# All sensitive values must be set via environment variables.
# ============================================================

spring:
  application:
    name: vitaura-backend

  # --- Database ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vitaura_db}
    username: ${DB_USERNAME:vitaura_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: VitauraPool

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema — never use create/update in prod
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # --- Flyway Migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8

  # --- Mail ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        ssl:
          trust: smtp.gmail.com

  # --- Web ---
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Server ---
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# --- Vitaura Application Properties ---
vitaura:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_MINIMUM_256_BIT_SECRET_KEY_REQUIRED_FOR_PRODUCTION}
      expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
      refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  contact:
    recipient-email: ${CONTACT_RECIPIENT_EMAIL:${MAIL_FROM:concierge@vitauranutrition.com}}
    rate-limit-per-hour: ${RATE_LIMIT_CONTACT_PER_HOUR:10}

  whatsapp:
    number: ${NEXT_PUBLIC_WHATSAPP_NUMBER:919000000000}

  payment:
    provider: ${PAYMENT_PROVIDER:demo}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      sandbox: true
    phonepe:
      merchant-id: ${PHONEPE_MERCHANT_ID:}
      salt-key: ${PHONEPE_SALT_KEY:}
      salt-index: ${PHONEPE_SALT_INDEX:1}
      sandbox: true

  delivery:
    free-delivery-minimum: 500  # INR - free delivery above this
    delivery-fee: 30  # INR default delivery fee
    max-delivery-radius-km: 25

# --- Logging ---
logging:
  level:
    root: INFO
    com.vitaura: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/vitaura.log

# --- Actuator (restricted) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
