version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gronliv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gronliv_db
      POSTGRES_USER: gronliv_user
      POSTGRES_PASSWORD: gronliv_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gronliv_user -d gronliv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
